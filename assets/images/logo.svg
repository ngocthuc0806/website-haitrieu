<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" role="img" aria-label="Hải Triều - Âm thanh Ánh sáng Màn hình LED">
  <defs>
    <linearGradient id="ht-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="ht-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2132"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="ht-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Biểu tượng: sóng âm + con sóng "triều" trong khối bo tròn -->
  <rect x="4" y="9" width="72" height="72" rx="20" fill="url(#ht-badge)" stroke="#f97316" stroke-opacity="0.55" stroke-width="1.5"/>
  <g fill="url(#ht-orange)">
    <rect x="15" y="40" width="6" height="14" rx="3"/>
    <rect x="25" y="30" width="6" height="30" rx="3"/>
    <rect x="35" y="20" width="6" height="44" rx="3"/>
    <rect x="45" y="28" width="6" height="34" rx="3"/>
    <rect x="55" y="38" width="6" height="18" rx="3"/>
  </g>
  <path d="M12 68 C22 60, 30 74, 40 67 S58 60, 68 67" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Chữ -->
  <text x="90" y="46" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="1" fill="url(#ht-text)">HẢI TRIỀU</text>
  <rect x="91" y="54" width="34" height="3" rx="1.5" fill="#f97316"/>
  <text x="91" y="73" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#fb923c">ÂM THANH · ÁNH SÁNG · LED</text>
</svg>

